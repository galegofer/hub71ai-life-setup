name: Verify submission
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Backend tests and package
        run: mvn -B -ntp -f backend/pom.xml test package
      - name: Frontend checks and build
        working-directory: frontend
        run: npm ci && npm run build
        env:
          PUBLIC_API_URL: https://backend-production-a5bdb.up.railway.app
      - name: Verify public deployment from an external network
        if: github.event_name == 'workflow_dispatch'
        run: |
          curl --fail --retry 3 --max-time 20 https://frontend-production-20da.up.railway.app/ -o /tmp/life-setup.html
          grep -q 'Life Setup' /tmp/life-setup.html
          python3 scripts/smoke-test.py --base-url https://backend-production-a5bdb.up.railway.app
