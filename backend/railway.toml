[build]
builder = "RAILPACK"
buildCommand = "mvn -B -ntp package"
watchPatterns = ["backend/**"]

[deploy]
startCommand = "java -jar target/life-setup-agent-0.1.0.jar"
healthcheckPath = "/api/health"
healthcheckTimeout = 60
numReplicas = 1
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
